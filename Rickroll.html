<!DOCTYPE html>
<html>
<head>
<style>
body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background:#000;margin:0}
.btn{padding:15px 30px;cursor:pointer;background:#f00;color:#fff;border:none;border-radius:5px;font-weight:bold}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:99;justify-content:center;align-items:center}
.content{position:relative;width:90%;max-width:800px;aspect-ratio:16/9}
.close{position:absolute;top:-45px;right:0;color:#fff;font-size:40px;cursor:pointer;background:none;border:none}
iframe{width:100%;height:100%;border:none}
</style>
</head>
<body>

<button class="btn" id="open">WATCH VIDEO</button>

<div class="overlay" id="modal">
    <div class="content">
        <button class="close" id="close">&times;</button>
        <iframe id="video" src="https://www.youtube.com" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
</div>

<script>
const m = document.getElementById('modal');
const v = document.getElementById('video');
const s = v.src;

document.getElementById('open').onclick = () => {
    m.style.display = 'flex';
    v.src = s + "&autoplay=1&mute=1";
};

const h = () => {
    m.style.display = 'none';
    v.src = s;
};

document.getElementById('close').onclick = h;
window.onclick = (e) => { if (e.target == m) h(); };
</script>

</body>
</html>
