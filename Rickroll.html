<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background:#111;margin:0}
.btn{padding:15px 30px;cursor:pointer;background:#ff0000;color:#fff;border:none;border-radius:5px;font-weight:bold}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:9999;justify-content:center;align-items:center}
.content{position:relative;width:90%;max-width:850px;aspect-ratio:16/9}
.close{position:absolute;top:-45px;right:0;color:#fff;font-size:45px;cursor:pointer;background:none;border:none}
iframe{width:100%;height:100%;border:none;border-radius:10px}
</style>
</head>
<body>

<button class="btn" id="open">WATCH VIDEO</button>

<div class="overlay" id="modal">
    <div class="content">
        <button class="close" id="close">&times;</button>
        <iframe id="video" 
            src="" 
            frameborder="0" 
            allow="autoplay; encrypted-media; picture-in-picture" 
            allowfullscreen 
            referrerpolicy="origin"
            sandbox="allow-scripts allow-same-origin allow-presentation allow-forms">
        </iframe>
    </div>
</div>

<script>
const m = document.getElementById('modal');
const v = document.getElementById('video');
const link = "https://www.youtube.com";

document.getElementById('open').onclick = () => {
    m.style.display = 'flex';
    v.src = link;
};

const hide = () => {
    m.style.display = 'none';
    v.src = "";
};

document.getElementById('close').onclick = hide;
window.onclick = (e) => { if (e.target == m) hide(); };
</script>

</body>
</html>
