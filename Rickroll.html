<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background:#111;margin:0}
.btn{padding:15px 30px;font-size:1.1rem;cursor:pointer;background:#ff0000;color:#fff;border:none;border-radius:4px;font-weight:700}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:999;justify-content:center;align-items:center}
.content{position:relative;width:90%;max-width:800px;aspect-ratio:16/9}
.close{position:absolute;top:-45px;right:0;color:#fff;font-size:40px;cursor:pointer;background:none;border:none}
iframe{width:100%;height:100%;border:none;border-radius:8px}
</style>
</head>
<body>

<button class="btn" id="open">WATCH VIDEO</button>

<div class="overlay" id="modal">
<div class="content">
<button class="close" id="close">&times;</button>
<iframe id="video" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</div>
</div>

<script>
const m=document.getElementById('modal');
const v=document.getElementById('video');
const link="https://www.youtube.com";

document.getElementById('open').onclick=()=>{
    m.style.display='flex';
    v.src=link+"&autoplay=1&mute=1";
};

const h=()=>{
    m.style.display='none';
    v.src='';
};

document.getElementById('close').onclick=h;
window.onclick=(e)=>{if(e.target==m)h()};
</script>

</body>
</html>
